<style>
  @import '/css/deprecated-login-credentials.css';

  html {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    height: 100%;
    margin: 0;
  }

  .__private__homey-login-credentials {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
  }

  .__private__homey-login-credentials__form {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
  }

  .__private__homey-login-credentials__center {
    width: 100%;
    flex-shrink: 0;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
  }

  .pair-view-flex-spacer {
    flex-grow: 1;
    flex-shrink: 0;
    min-height: var(--homey-su-2);
  }

  .__private__homey-login-credentials__footer {
    flex-shrink: 0;
  }

  #login-credentials-logo {
    display: block;
    width: auto;
    max-width: 280px;
    max-height: 72px;
    height: auto;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: var(--homey-su-4);
    object-fit: contain;
  }
</style>

<div class="__private__homey-login-credentials">
  <form
    id="connection-form"
    class="__private__homey-login-credentials__form homey-form"
    action="/"
    method="post"
  >
    <div class="__private__homey-login-credentials__center">
      <img
        id="login-credentials-logo"
        src="device_ip.assets/logo.png"
        alt=""
      />
      <h1
        id="login-credentials-title"
        class="homey-title homey-text-align-center"
        data-i18n="device.pair.device_ip.title"
      ></h1>

      <div class="homey-form-group-large">
        <label
          class="homey-form-label"
          for="ipAddress"
          data-i18n="device.pair.device_ip.addressLabel"
        ></label>
        <input
          class="homey-form-input-large"
          id="ipAddress"
          type="text"
          value=""
          data-i18n-placeholder="device.pair.device_ip.addressPlaceholder"
        />
      </div>
    </div>

    <div class="pair-view-flex-spacer" aria-hidden="true"></div>

    <div class="__private__homey-login-credentials__footer">
      <button
        tabindex="0"
        class="homey-button-primary-shadow-full __private__homey-login-credentials__button"
        id="next"
        data-i18n="device.pair.device_ip.connect"
        type="submit"
      ></button>
    </div>
  </form>
</div>

<script type="text/javascript">
  (function () {
    Homey.setTitle(null);

    document.getElementById('connection-form').addEventListener('submit', function (event) {
      event.preventDefault();

      var btn = document.getElementById('next');
      if (btn.classList.contains('is-loading')) return;
      btn.classList.add('is-loading');

      var ipAddress = document.getElementById('ipAddress').value.trim();
      if (!ipAddress) {
        btn.classList.remove('is-loading');
        Homey.alert(Homey.__('device.ipAddressRequired'));
        return false;
      }

      Homey.emit('check_details', { ipAddress: ipAddress })
        .then(function (result) {
          if (!result) {
            throw new Error(Homey.__('device.failed'));
          }
          return Homey.createDevice(result);
        })
        .then(function () {
          Homey.done();
        })
        .catch(function (error) {
          Homey.alert(error && error.message ? error.message : String(error));
          btn.classList.remove('is-loading');
        });

      return false;
    });
  })();
</script>
